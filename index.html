<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LootLabs Bypasser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container { width: 100%; max-width: 680px; }
  .header { text-align: center; margin-bottom: 36px; }
  .header h1 { font-size: 1.4rem; color: #fff; letter-spacing: 0.15em; text-transform: uppercase; }
  .header p { color: #555; font-size: 0.75rem; margin-top: 6px; letter-spacing: 0.08em; }
  .card { background: #111118; border: 1px solid #1e1e2e; border-radius: 10px; padding: 28px; }
  .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
  input[type="text"] {
    flex: 1;
    background: #0d0d14;
    border: 1px solid #2a2a3e;
    border-radius: 6px;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: #5c5cff; }
  input[type="text"]::placeholder { color: #333; }
  button {
    background: #5c5cff;
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    font-weight: bold;
    letter-spacing: 0.05em;
    padding: 12px 22px;
    transition: background 0.2s;
    white-space: nowrap;
  }
  button:hover { background: #4a4ae0; }
  button:disabled { background: #2a2a4a; cursor: not-allowed; }
  .log {
    background: #0d0d14;
    border: 1px solid #1a1a2a;
    border-radius: 6px;
    font-size: 0.8rem;
    min-height: 160px;
    padding: 14px;
    overflow-y: auto;
    max-height: 320px;
  }
  .log-line { margin-bottom: 6px; line-height: 1.5; }
  .log-info  { color: #888; }
  .log-step  { color: #5c5cff; }
  .log-ok    { color: #3ecf8e; }
  .log-err   { color: #ff4d4d; }
  .log-warn  { color: #f0a500; }
  .result-box {
    display: none;
    margin-top: 16px;
    background: #0d1a12;
    border: 1px solid #1e4a2a;
    border-radius: 6px;
    padding: 14px;
    word-break: break-all;
  }
  .result-box.visible { display: block; }
  .result-label { color: #3ecf8e; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .result-url { color: #e0e0e0; font-size: 0.85rem; margin-bottom: 12px; }
  .result-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-sm {
    background: #1a1a2e;
    border: 1px solid #2a2a4e;
    border-radius: 4px;
    color: #aaa;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 0.75rem;
    padding: 6px 12px;
    transition: all 0.15s;
  }
  .btn-sm:hover { background: #2a2a4e; color: #fff; }
  .btn-open { background: #5c5cff22; border-color: #5c5cff55; color: #8888ff; }
  .btn-open:hover { background: #5c5cff44; color: #fff; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>LootLabs Bypasser</h1>
    <p>lootlabs.gg &nbsp;·&nbsp; lootlink.org</p>
  </div>
  <div class="card">
    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://lootlabs.gg/... or https://links.lootlabs.gg/s?..." />
      <button id="bypassBtn" onclick="runBypass()">BYPASS</button>
    </div>
    <div class="log" id="log">
      <div class="log-line log-info">// Ready. Paste a URL and hit bypass.</div>
    </div>
    <div class="result-box" id="resultBox">
      <div class="result-label">Destination Resolved</div>
      <div class="result-url" id="resultUrl"></div>
      <div class="result-actions">
        <button class="btn-sm" onclick="copyResult()">Copy URL</button>
        <button class="btn-sm btn-open" onclick="openResult()">Open Link</button>
      </div>
    </div>
  </div>
</div>

<script>
  let lastResult = "";

  // Proxy chain — tried in order until one succeeds
  const PROXIES = [
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    url => `https://thingproxy.freeboard.io/fetch/${url}`,
  ];

  // Fetch through proxy chain — returns { html, proxyIndex } or throws
  async function proxyFetch(targetUrl) {
    let lastErr = null;
    for (let i = 0; i < PROXIES.length; i++) {
      const proxyUrl = PROXIES[i](targetUrl);
      try {
        const resp = await Promise.race([
          fetch(proxyUrl),
          new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000))
        ]);
        if (!resp.ok) { lastErr = `HTTP ${resp.status}`; continue; }
        const raw = await resp.text();
        // allorigins wraps in JSON; others return raw HTML
        let html = raw;
        if (i === 0) {
          try {
            const parsed = JSON.parse(raw);
            html = parsed.contents || raw;
          } catch { /* raw text */ }
        }
        if (!html || html.length < 200) { lastErr = "empty response"; continue; }
        return { html, proxyIndex: i };
      } catch (e) {
        lastErr = e.message;
        log(`[*] Proxy ${i + 1} failed: ${e.message}`, "warn");
      }
    }
    throw new Error(`All proxies failed. Last: ${lastErr}`);
  }

  function log(msg, type = "info") {
    const box = document.getElementById("log");
    const line = document.createElement("div");
    line.className = `log-line log-${type}`;
    line.textContent = msg;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function clearLog() {
    document.getElementById("log").innerHTML = "";
    document.getElementById("resultBox").classList.remove("visible");
    lastResult = "";
  }

  function showResult(url) {
    lastResult = url;
    document.getElementById("resultUrl").textContent = url;
    document.getElementById("resultBox").classList.add("visible");
  }

  function copyResult() {
    if (!lastResult) return;
    navigator.clipboard.writeText(lastResult).then(() => log("[+] Copied.", "ok"));
  }

  function openResult() {
    if (!lastResult) return;
    window.open(lastResult, "_blank", "noopener");
  }

  async function runBypass() {
    const url = document.getElementById("urlInput").value.trim();
    if (!url) return;
    clearLog();
    document.getElementById("bypassBtn").disabled = true;
    log(`[*] Target: ${url}`, "step");
    try {
      const result = await bypass(url);
      if (result.startsWith("[!]")) {
        log(result, "err");
      } else {
        log(`[+] Resolved: ${result}`, "ok");
        showResult(result);
      }
    } catch (e) {
      log(`[!] Fatal: ${e.message}`, "err");
    }
    document.getElementById("bypassBtn").disabled = false;
  }

  async function bypass(url) {
    const parsed = new URL(url);
    const host = parsed.hostname;

    if (!host.includes("lootlabs") && !host.includes("lootlink")) {
      return "[!] Unsupported domain: " + host;
    }

    log("[*] Fetching page through proxy chain...", "step");
    let html, proxyIndex;
    try {
      ({ html, proxyIndex } = await proxyFetch(url));
      log(`[+] Page fetched via proxy ${proxyIndex + 1} (${html.length} bytes)`, "ok");
    } catch (e) {
      return `[!] ${e.message}`;
    }

    log("[*] Scanning __NEXT_DATA__...", "step");

    // Pass 1: __NEXT_DATA__ JSON walk
    const nextMatch = html.match(/<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/);
    if (nextMatch) {
      try {
        const nextData = JSON.parse(nextMatch[1]);
        const found = walkForDestination(nextData);
        if (found) {
          log("[+] Found in __NEXT_DATA__", "ok");
          return found;
        }
      } catch { /* malformed JSON, fall through */ }
    }

    // Pass 2: deep HTML sweep
    log("[*] __NEXT_DATA__ miss. Deep sweeping HTML...", "warn");
    const deepSwept = deepSweepHTML(html);
    if (deepSwept) {
      log("[+] Found via deep HTML sweep", "ok");
      return deepSwept;
    }

    // Pass 3: key extraction + API probe
    log("[*] Deep sweep miss. Extracting key...", "warn");
    const key = extractKey(url, html);
    if (!key) {
      log("[*] No key found. Falling back to raw URL sweep...", "warn");
      const swept = sweepHTML(html);
      if (swept) {
        log("[+] Swept from raw HTML", "ok");
        return swept;
      }
      return "[!] Could not extract content key — destination not found in page";
    }

    log(`[*] Key: ${key}. Probing API...`, "step");
    return await apiResolve(key, url, proxyIndex);
  }

  function walkForDestination(obj) {
    if (!obj || typeof obj !== "object") return null;
    const fields = ["destination", "url", "link", "redirect", "target", "href", "redirectUrl", "finalUrl", "dest"];
    const blocked = /lootlabs|lootlink|google|facebook|cloudflare|gtag|cdn\.|static\.|_next|vercel/i;

    for (const f of fields) {
      if (typeof obj[f] === "string" && obj[f].startsWith("http") && !blocked.test(obj[f])) {
        return obj[f];
      }
    }
    for (const key of Object.keys(obj)) {
      const result = walkForDestination(obj[key]);
      if (result) return result;
    }
    return null;
  }

  function deepSweepHTML(html) {
    const blocked = /lootlabs|lootlink|google|facebook|cloudflare|gtag|cdn\.|static\.|_next|vercel|twitter|discord\.gg|schema\.org|w3\.org/i;

    const patterns = [
      /(?:destination|url|link|redirect|href|target|finalUrl|redirectUrl)\s*[=:]\s*["'`](https?:\/\/[^"'`\s]{8,})["'`]/gi,
      /data-(?:href|url|destination|link|redirect)\s*=\s*["'](https?:\/\/[^"'\s]{8,})["']/gi,
      /window\.location(?:\.href)?\s*=\s*["'`](https?:\/\/[^"'`\s]{8,})["'`]/gi,
      /content\s*=\s*["']\d+;\s*url=(https?:\/\/[^"'\s]{8,})["']/gi,
      /"(?:destination|redirectUrl|finalUrl|target|href)"\s*:\s*"(https?:\/\/[^"]{8,})"/gi,
    ];

    for (const pat of patterns) {
      for (const m of html.matchAll(pat)) {
        const u = m[1];
        if (u && !blocked.test(u)) return u;
      }
    }

    const urls = [...html.matchAll(/https?:\/\/[^\s"'\\<>{}\[\]]{12,}/g)].map(m => m[0]);
    return urls.find(u => !blocked.test(u)) || null;
  }

  function sweepHTML(html) {
    const blocked = /lootlabs|lootlink|google|facebook|cloudflare|gtag|cdn\.|static\.|_next|vercel|twitter|discord\.gg/i;
    const urls = [...html.matchAll(/https?:\/\/[^\s"'\\<>]{10,}/g)].map(m => m[0]);
    return urls.find(u => !blocked.test(u)) || null;
  }

  function extractKey(url, html) {
    const parsed = new URL(url);

    for (const [name, value] of parsed.searchParams.entries()) {
      if (/^[a-zA-Z0-9_-]{6,20}$/.test(name) && (value === "" || value.length > 10)) {
        return name;
      }
    }

    for (const param of ["key", "id", "c", "ref", "token", "s", "code"]) {
      const val = parsed.searchParams.get(param);
      if (val && val.length > 3) return val;
    }

    const parts = parsed.pathname.split("/").filter(Boolean);
    if (parts.length > 0) {
      const last = parts[parts.length - 1];
      if (last.length > 4) return last;
    }

    const match = html.match(/['"](?:key|code|id)['"]\s*:\s*['"]([a-zA-Z0-9_-]{6,})['"]/);
    if (match) return match[1];

    return null;
  }

  async function apiResolve(key, referer, workingProxyIndex = 0) {
    const parsed = new URL(referer);
    const base = parsed.hostname.includes("lootlabs") ? "https://lootlabs.gg" : "https://lootlink.org";
    const linksBase = parsed.hostname.includes("lootlabs") ? "https://links.lootlabs.gg" : "https://links.lootlink.org";

    const endpoints = [
      `${linksBase}/api/resolve?key=${key}`,
      `${linksBase}/api/s/${key}`,
      `${base}/api/content/${key}`,
      `${base}/api/links/${key}`,
      `${base}/api/v1/links/${key}/destination`,
      `${base}/api/v2/content/${key}`,
    ];

    for (const ep of endpoints) {
      log(`[*] Trying ${ep.replace(/https?:\/\/[^/]+/, '')}`, "step");
      try {
        await sleep(600 + Math.random() * 900);

        // Try working proxy first, then fall through chain
        let html = null;
        for (let pi = workingProxyIndex; pi < PROXIES.length; pi++) {
          try {
            const proxyUrl = PROXIES[pi](ep);
            const resp = await Promise.race([
              fetch(proxyUrl),
              new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000))
            ]);
            if (!resp.ok) continue;
            const raw = await resp.text();
            if (pi === 0) {
              try { html = JSON.parse(raw).contents; } catch { html = raw; }
            } else {
              html = raw;
            }
            if (html && html.length > 10) break;
          } catch { continue; }
        }

        if (!html) continue;
        let data;
        try { data = JSON.parse(html); } catch { continue; }

        const fields = ["destination", "url", "link", "redirect", "href", "target", "redirectUrl", "finalUrl"];
        for (const f of fields) {
          if (data[f] && typeof data[f] === "string" && data[f].startsWith("http")) return data[f];
          if (data.data?.[f] && typeof data.data[f] === "string") return data.data[f];
        }
      } catch { continue; }
    }

    return "[!] API resolve failed — paste the full URL including all query params";
  }

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  document.getElementById("urlInput").addEventListener("keydown", e => {
    if (e.key === "Enter") runBypass();
  });
</script>
</body>
</html>
